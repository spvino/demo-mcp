[project]
name = "demo-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "fastapi>=0.128.8",
    "fastmcp>=4.1.4",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.39.0",
]

[project.scripts]
demo-mcp = "app.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
